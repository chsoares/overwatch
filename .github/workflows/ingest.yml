name: ingest

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-ingestion.txt
      - name: Run collectors
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          LOG_LEVEL: DEBUG
        run: |
          python scripts/ransom_dataset.py
          python scripts/vuln_dataset.py
          python scripts/mailsec.py
      - name: Commit data
        run: |
          git config user.name  "overwatch-bot"
          git config user.email "overwatch-bot@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Update ransom, vuln and mailsec datasets: $(date -u +%F)"
            git push
          fi
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-logs
          path: logs/
          if-no-files-found: ignore
