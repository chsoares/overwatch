name: ingest

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 America/Sao_Paulo, daily (ransom + vuln)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-ingestion.txt

      - name: Collect ransomware
        continue-on-error: true
        timeout-minutes: 120
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOG_LEVEL: DEBUG
        run: python scripts/ransom_dataset.py

      - name: Collect vulnerabilities
        continue-on-error: true
        timeout-minutes: 60
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          LOG_LEVEL: DEBUG
        run: python scripts/vuln_dataset.py

      - name: Collect email security (weekly)
        # Runs on Sundays (UTC weekday 7) or on a manual dispatch.
        timeout-minutes: 90
        env:
          LOG_LEVEL: DEBUG
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "Running mailsec collector"
            python scripts/mailsec.py
          else
            echo "Skipping mailsec (runs weekly on Sundays)"
          fi

      - name: Commit data
        run: |
          git config user.name  "overwatch-bot"
          git config user.email "overwatch-bot@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Update ransom, vuln and mailsec datasets: $(date -u +%F)"
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-logs
          path: logs/
          if-no-files-found: ignore
